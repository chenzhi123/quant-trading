services:
  - type: web
    name: optionguard
    runtime: python
    plan: free
    branch: cursor/option-trading-system
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py web
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.11.9"
